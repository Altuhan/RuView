name: Kite Android POS

on:
  push:
    paths: ["ui-framework/**", ".github/workflows/kite-android.yml"]
  pull_request:
    paths: ["ui-framework/**", ".github/workflows/kite-android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ui-framework/examples/android-pos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: x86_64-linux-android, aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui-framework

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APKs (Rust via cargo-ndk, then Gradle)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libkitepos

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 10
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: ui-framework/examples/android-pos
          script: ./ci-emulator.sh

      - name: Upload APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kite-android-pos
          path: |
            ui-framework/examples/android-pos/app/build/outputs/apk/debug/app-debug.apk
            ui-framework/examples/android-pos/build/emulator-evidence/
          if-no-files-found: warn
