[package]
name = "kite"
description = "Kite: a declarative UI framework with its own .ui language, for desktop, web and microcontrollers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std", "desktop"]
std = ["kite-core/std"]
# Native window backend (winit + softbuffer).
desktop = ["std", "dep:kite-winit"]
# Load and compile .ui files at runtime.
interpreter = ["std", "dep:kite-compiler"]
# Offscreen rendering and input simulation (tests, screenshots).
headless = ["std", "dep:kite-headless"]

[dependencies]
kite-core.workspace = true
kite-winit = { workspace = true, optional = true }
kite-compiler = { workspace = true, optional = true }
kite-headless = { workspace = true, optional = true }
