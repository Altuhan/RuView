[package]
name = "kite-cli"
description = "Kite command-line tool: check, render, codegen and live preview of .ui files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kite"
path = "src/main.rs"

[features]
default = ["preview"]
# Live-preview window (winit + softbuffer).
preview = ["dep:kite-winit"]

[dependencies]
kite-core = { workspace = true, features = ["std"] }
kite-compiler.workspace = true
kite-headless.workspace = true
kite-winit = { workspace = true, optional = true }
