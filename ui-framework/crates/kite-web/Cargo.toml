[package]
name = "kite-web"
description = "Browser backend for Kite: renders into an HTML canvas from WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kite-core = { workspace = true, features = ["std"] }
wasm-bindgen.workspace = true

[dependencies.web-sys]
workspace = true
features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "ImageData",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "Window",
]
