<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kite on the web</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e5e7eb; font-family: system-ui, sans-serif; }
    canvas { width: 320px; height: 200px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.15); outline: none; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <script type="module">
    import init, * as kite from "./pkg/kite_example_web_counter.js";
    init().then(() => { window.kite = kite; window.kiteReady = true; });
  </script>
</body>
</html>
